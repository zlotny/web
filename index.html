    <link rel="stylesheet" href="/src/ui/style.css" />
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.6rem;
        background: radial-gradient(ellipse at 50% 42%, #1c2742, #0c101e 70%);
        color: #f7f2e6;
        font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
        transition: opacity 0.9s ease, visibility 0s linear 0.9s;
      }
      #boot.done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot svg {
        width: 5.5rem;
        height: 5.5rem;
        overflow: visible;
      }
      #boot .plume {
        fill: none;
        stroke: #f6dd52;
        stroke-width: 3.2;
        stroke-linecap: round;
        transform-origin: 50% 88%;
        animation: boot-sway 1.5s ease-in-out infinite alternate;
      }
      #boot .plume:nth-child(2) { animation-delay: -0.25s; }
      #boot .plume:nth-child(3) { animation-delay: -0.5s; }
      #boot .plume:nth-child(4) { animation-delay: -0.75s; }
      #boot .cheek {
        fill: #f0692c;
        animation: boot-pulse 1.5s ease-in-out infinite alternate;
        transform-origin: 50% 88%;
      }
      #boot h1 {
        margin: 0;
        font-style: italic;
        font-weight: 500;
        font-size: clamp(1.8rem, 6vw, 3rem);
        letter-spacing: -0.01em;
      }
      #boot .track {
        width: min(15rem, 60vw);
        height: 3px;
        border-radius: 3px;
        background: rgba(247, 242, 230, 0.16);
        overflow: hidden;
      }
      #boot .fill {
        width: 100%;
        height: 100%;
        background: #f6dd52;
        transform: scaleX(0.04);
        transform-origin: 0 50%;
        transition: transform 0.5s ease;
      }
      #boot p {
        margin: 0;
        font-family: ui-rounded, 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
        font-size: 0.78rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(247, 242, 230, 0.7);
        min-height: 1.2em;
      }
      @keyframes boot-sway {
        from { transform: rotate(-9deg); }
        to { transform: rotate(8deg); }
      }
      @keyframes boot-pulse {
        from { transform: scale(0.85); }
        to { transform: scale(1.1); }
      }
    </style>
  </head>
  <body>
    <noscript><p style="position:fixed;inset:0;z-index:99;display:grid;place-content:center;margin:0;background:#0c101e;color:#f7f2e6;font-family:Georgia,serif;text-align:center">Andrés Vieira, software engineer from Galicia.<br />This island needs JavaScript.</p></noscript>
    <div id="boot" role="status" aria-live="polite">

        <path class="plume" d="M50 88 C46 60 40 40 52 14" />
        <path class="plume" d="M50 88 C52 62 52 44 66 22" />
        <path class="plume" d="M50 88 C56 66 62 52 78 36" />
        <path class="plume" d="M50 88 C42 66 32 52 30 30" />
        <circle class="cheek" cx="50" cy="88" r="7" />
      </svg>
      <h1>Andrés Vieira</h1>
      <div class="track"><div class="fill" id="boot-fill"></div></div>
      <p id="boot-text">Loading</p>
    </div>
    <canvas id="world"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
